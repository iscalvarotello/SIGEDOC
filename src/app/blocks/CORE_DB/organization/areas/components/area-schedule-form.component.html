<div class="fixed inset-0 z-50 bg-gray-50 dark:bg-gray-900 overflow-y-auto pt-16 pb-12 px-6 flex flex-col justify-start items-center">
  <div class="w-full max-w-4xl bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-150 dark:border-gray-700 overflow-hidden flex flex-col">
    <!-- Header -->
    <div class="bg-gradient-to-r from-[#691C32] via-[#9F2241] to-[#BC955C] px-8 py-6 text-white relative">
      <h2 class="text-2xl font-bold">Horarios de Recepción de Documentos</h2>
      <p class="text-sm opacity-90 mt-1">Configurar días y horas hábiles para la recepción de correspondencia oficial.</p>
      <p class="text-xs font-mono bg-white/10 inline-block px-3 py-1 rounded-full mt-3">
        Área: {{ area.name }} ({{ area.acronym }})
      </p>
    </div>

    <!-- Body -->
    <div class="p-8 space-y-6 flex-1">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        @for (day of daysOfWeek; track day.key) {
          <div class="bg-gray-50 dark:bg-gray-900 rounded-xl p-5 border border-gray-150 dark:border-gray-800 flex items-center justify-between transition-all hover:shadow-md">
            <div class="flex-1">
              <span class="block text-sm font-bold text-gray-800 dark:text-gray-200 capitalize mb-1">{{ day.label }}</span>
              <div class="flex items-center gap-2 mt-2">
                <app-time-picker
                  [id]="day.key + '-inicio'"
                  label=""
                  placeholder="09:00"
                  [disabled]="!scheduleData[day.key].recepcion"
                  [defaultTime]="scheduleData[day.key].hora_inicio"
                  (timeChange)="scheduleData[day.key].hora_inicio = $event">
                </app-time-picker>
                <span class="text-xs text-gray-400 font-semibold mt-1">a</span>
                <app-time-picker
                  [id]="day.key + '-fin'"
                  label=""
                  placeholder="16:00"
                  [disabled]="!scheduleData[day.key].recepcion"
                  [defaultTime]="scheduleData[day.key].hora_fin"
                  (timeChange)="scheduleData[day.key].hora_fin = $event">
                </app-time-picker>
              </div>
            </div>

            <!-- Custom Sliding Switch -->
            <label class="relative inline-flex items-center cursor-pointer select-none ml-4">
              <input 
                type="checkbox" 
                [(ngModel)]="scheduleData[day.key].recepcion"
                (change)="onScheduleToggle(day.key)"
                class="sr-only peer"
              />
              <div class="w-11 h-6 bg-gray-250 dark:bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#691C32]"></div>
            </label>
          </div>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="bg-gray-50 dark:bg-gray-900/50 px-8 py-5 border-t border-gray-150 dark:border-gray-850 flex justify-end gap-3 shrink-0">
      <button 
        (click)="cancel()"
        class="px-5 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-750 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-750 rounded-xl text-xs font-bold transition-all duration-200 shadow-sm cursor-pointer">
        Cancelar
      </button>
      <button 
        (click)="save()"
        [disabled]="isSaving"
        class="px-6 py-2.5 bg-gradient-to-r from-[#691C32] to-[#8A253F] hover:from-[#8A253F] hover:to-[#A12B4A] text-white rounded-xl text-xs font-bold shadow-md transition-all duration-300 hover:shadow-lg active:scale-95 flex items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        @if (isSaving) {
          <span class="animate-spin rounded-full h-3.5 w-3.5 border-2 border-t-transparent border-white"></span>
        }
        Guardar Configuración
      </button>
    </div>
  </div>
</div>
