<app-master-wrapper
  title="Matriz de Distancias y Casetas"
  subtitle="Consulta y gestiona las distancias, vías y peajes entre diferentes ciudades."
  
  [serverError]="serverError()"
  (onSearch)="filtrar($event)"
  (onRefresh)="refresh()"
  (onSync)="sync()"
  (onNew)="nuevo()">

  <!-- Filtro Especial de Ciudad de Origen -->
  <div customFilters class="w-full bg-white dark:bg-gray-800 p-4 border-b border-gray-100 dark:border-gray-700">
    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Selecciona la Ciudad de Origen para ver sus destinos:</label>
    <app-filter-city
      layout="horizontal"
      [initialCountryId]="activeUrlParams?.originCountryId || ''"
      [initialStateId]="activeUrlParams?.originStateId || ''"
      [initialCityId]="activeUrlParams?.originCityId || ''"
      (onCountrySelect)="onOriginCountryChange($event)"
      (onStateSelect)="onOriginStateChange($event)"
      (onCitySelect)="onOriginCityChange($event)">
    </app-filter-city>
  </div>

  <div master class="h-full relative">
    @if (!activeUrlParams?.originCityId) {
      <div class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 bg-gray-50/50 dark:bg-gray-900/50">
        <div class="w-16 h-16 bg-[#691C32]/10 rounded-full flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-[#691C32]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-1">Esperando Origen</h3>
        <p class="text-sm text-gray-500 max-w-xs">Usa el selector de arriba para elegir una ciudad de origen y cargar sus distancias registradas.</p>
      </div>
    } @else {
      <app-data-table
        [data]="filteredItems()"
        [columns]="pageConfig.tableColumns"
        [selectedItem]="selectedItem()"
        [isLoading]="isLoading()"
        (onRowSelect)="select($event)"
        (onEdit)="edit($event)"
        (onDelete)="delete($event)">
      </app-data-table>
    }
  </div>

  <div detail class="h-full flex flex-col">
    @if (selectedItem()) {
      <app-detail-viewer
        [data]="selectedItem()"
        [headerConfig]="pageConfig.detailHeader"
        [fields]="pageConfig.detailFields">
      </app-detail-viewer>
    }
  </div>
</app-master-wrapper>
