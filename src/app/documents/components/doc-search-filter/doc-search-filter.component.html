<!-- PANEL DE CONTROLES (Buscador y Fechas) -->
<div class="bg-white border border-gray-200 rounded-2xl p-4 mb-6 shadow-sm dark:border-gray-800 dark:bg-white/3">
  <div class="flex flex-col xl:flex-row gap-4 items-center justify-between">
    
    <!-- Filtros de fecha y búsqueda -->
    <div class="flex flex-col md:flex-row flex-wrap items-center gap-3 w-full xl:w-auto flex-1">
      
      <!-- Buscador -->
      <div class="relative w-full md:w-72 lg:w-80 shrink-0">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </span>
        <input 
          type="text" 
          [ngModel]="searchQuery"
          (ngModelChange)="searchQueryChange.emit($event)"
          (input)="inputSearch.emit()"
          placeholder="Buscar por asunto, tema o folio..."
          class="w-full pl-10 pr-4 py-2 bg-gray-50 hover:bg-gray-100/70 focus:bg-white border border-gray-200 focus:border-[#BC955C] focus:ring-1 focus:ring-[#BC955C] rounded-xl text-sm transition-all outline-none text-gray-700 font-medium" />
      </div>

      <!-- Contenedor de Fechas y Filtrado -->
      <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
        <!-- Fecha Inicio -->
        <div class="w-[135px]">
          <app-date-picker
            id="start_date_filter"
            size="sm"
            prefixLabel="Desde:"
            [defaultDate]="startDateInput"
            (dateChange)="startDateInputChange.emit($event.dateStr)">
          </app-date-picker>
        </div>

        <!-- Fecha Fin -->
        <div class="w-[135px]">
          <app-date-picker
            id="end_date_filter"
            size="sm"
            prefixLabel="Hasta:"
            [defaultDate]="endDateInput"
            (dateChange)="endDateInputChange.emit($event.dateStr)">
          </app-date-picker>
        </div>

        <!-- Botones de Acción de Fechas -->
        <div class="flex items-center gap-1.5">
          <button 
            (click)="applyFilter.emit()"
            class="px-3 py-1.5 bg-[#BC955C] hover:bg-[#a68350] active:scale-95 text-white rounded-lg text-xs font-bold transition-all flex items-center gap-1 shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            </svg>
            Filtrar
          </button>
          
          @if (appliedStartDate || appliedEndDate || startDateInput || endDateInput) {
            <button 
              (click)="clearFilter.emit()"
              class="px-2 py-1.5 border border-gray-200 hover:bg-gray-100 text-gray-500 rounded-lg text-xs font-bold transition-all flex items-center justify-center"
              title="Limpiar fechas">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          }
        </div>
      </div>

    </div>

    <!-- Botón Nuevo Documento o contenido proyectado -->
    <div class="w-full xl:w-auto flex justify-end shrink-0">
      <ng-content></ng-content>
    </div>

  </div>
</div>
