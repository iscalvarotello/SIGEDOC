<div class="mb-5 flex justify-start items-center gap-3">
  <div class="bg-gray-100 p-1 rounded-2xl flex gap-1 border border-gray-200/60 dark:bg-white/5 dark:border-gray-800">
    
    <button 
      (click)="tipoChange.emit('directo')"
      [class]="selectedTipo === 'directo' ? 'bg-[#691C32] text-white shadow-md' : 'text-gray-600 hover:text-[#691C32]'"
      class="px-6 py-2 rounded-xl text-xs font-black uppercase transition-all duration-300 flex items-center gap-2 active:scale-95">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span>Directo</span>
      <span 
        [class]="selectedTipo === 'directo' ? 'bg-white/25 text-white' : 'bg-gray-250 text-gray-500'"
        class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold transition-all duration-300">
        {{ countDirecto }}
      </span>
    </button>

    <button 
      (click)="tipoChange.emit('gestionado')"
      [class]="selectedTipo === 'gestionado' ? 'bg-[#691C32] text-white shadow-md' : 'text-gray-600 hover:text-[#691C32]'"
      class="px-6 py-2 rounded-xl text-xs font-black uppercase transition-all duration-300 flex items-center gap-2 active:scale-95">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span>Gestionado</span>
      <span 
        [class]="selectedTipo === 'gestionado' ? 'bg-white/25 text-white' : 'bg-gray-250 text-gray-500'"
        class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold transition-all duration-300">
        {{ countGestionado }}
      </span>
    </button>

  </div>

  <button 
    (click)="refresh.emit()"
    [disabled]="isLoading"
    class="p-2.5 bg-white border border-gray-200 hover:bg-gray-50 dark:bg-white/3 dark:border-gray-800 dark:hover:bg-white/5 rounded-2xl shadow-sm text-gray-500 hover:text-[#691C32] dark:text-gray-400 dark:hover:text-[#BC955C] active:scale-95 transition-all flex items-center justify-center shrink-0 disabled:opacity-50"
    title="Recargar Bandeja">
    @if (isLoading) {
      <span class="flex items-center justify-center" [innerHTML]="icons.animated_reload | safeHtml"></span>
    } @else {
      <span class="w-4 h-4 flex items-center justify-center" [innerHTML]="icons.Refresh | safeHtml"></span>
    }
  </button>
</div>
