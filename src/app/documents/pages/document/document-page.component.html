<!-- Breadcrumb Superior -->
<app-page-breadcrumb [pageTitle]="(claseDocumentoId() | claseDocument:'plural') + (activeAreaName() ? ' - BANDEJA: ' + activeAreaName() : '')" />

<!-- SELECTOR DIRECTO / GESTIONADO Y REFRESH -->
 <doc-type-selector
  [selectedTipo]="selectedTipo()"
  [countDirecto]="countDirecto()"
  [countGestionado]="countGestionado()"
  [isLoading]="isLoading()"
  (tipoChange)="selectedTipo.set($event); closeActionForm()"
  (refresh)="loadInbox()">
</doc-type-selector>


<!-- BANDEJAS HORIZONTALES (Selector Superior de Carpetas) -->
 <doc-bandeja-tabs
  [bandejas]="bandejasWithCounts()"
  [selectedBandeja]="selectedBandeja()"
  [isLoading]="isLoading()"
  (bandejaChange)="selectBandeja($event)">
</doc-bandeja-tabs>


<!-- PANEL DE CONTROLES (Buscador y Fechas) -->
<doc-search-filter
  [searchQuery]="searchQuery()"
  (searchQueryChange)="searchQuery.set($event)"
  [startDateInput]="startDateInput()"
  (startDateInputChange)="startDateInput.set($event)"
  [endDateInput]="endDateInput()"
  (endDateInputChange)="endDateInput.set($event)"
  [appliedStartDate]="appliedStartDate()"
  [appliedEndDate]="appliedEndDate()"
  (inputSearch)="closeActionForm()"
  (applyFilter)="applyDateFilter()"
  (clearFilter)="clearDateFilter()">
  
  <!-- Botón Nuevo Documento -->
  <button 
    [routerLink]="['/form-new-document', claseDocumentoId()]"
    class="w-full xl:w-auto px-5 py-2.5 rounded-xl text-xs font-extrabold text-white bg-[#691C32] hover:bg-[#4d1425] active:scale-95 transition-all duration-300 shadow-md flex items-center justify-center gap-2">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
    </svg>
    Nuevo {{ claseDocumentoId() | claseDocument:'singular':true }}
  </button>
</doc-search-filter>

<!-- VISTA PRINCIPAL DE 2 COLUMNAS -->
<div class="flex flex-col lg:flex-row gap-6 min-h-[500px]">

  <!-- COLUMNA IZQUIERDA: Tarjetas de Documentos (40%) -->
  <doc-list
    class="w-full lg:w-[42%] flex flex-col"
    [documents]="filteredDocuments()"
    [selectedDocId]="selectedDocId()"
    [isLoading]="isLoading()"
    (selectDocument)="selectDocument($event)"
    (openPdf)="openPdf($event.type, $event.doc)">
  </doc-list>

  <!-- COLUMNA DERECHA: Detalle y Acciones del Documento (60%) -->
  <doc-detail
    class="w-full lg:w-[58%] flex flex-col"
    [doc]="selectedDoc()"
    [selectedTipo]="selectedTipo()"
    [claseDocumentoId]="claseDocumentoId()"
    (actionCompleted)="loadInbox()">
  </doc-detail>

</div>
