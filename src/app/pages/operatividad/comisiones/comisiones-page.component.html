<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Saludo de Bienvenida -->
  <div class="col-span-12">
    <div class="bg-gradient-to-r from-[#691C32] via-[#9F2241] to-[#BC955C] rounded-2xl p-6 md:p-8 text-white shadow-lg relative overflow-hidden">
      <div class="relative z-10">
        <h1 class="text-2xl md:text-3xl font-extrabold mb-2">¡Hola, {{ userName() }}! 👋</h1>
        <p class="text-white/90 text-sm md:text-base font-medium">
          Bienvenido a tu panel de control de SIGEDOC. Hoy es {{ todayDate() }}.
        </p>
        @if (activeAreaName()) {
          <div class="mt-3 inline-flex items-center gap-2 px-3.5 py-1.5 bg-white/15 backdrop-blur-md rounded-xl text-xs font-black tracking-wide uppercase border border-white/10 select-none shadow-sm">
            <span class="inline-flex rounded-full h-2 w-2 bg-emerald-400 animate-pulse shrink-0"></span>
            Estas en la Bandeja de la {{ activeAreaName() }}
          </div>
        }
      </div>
      <!-- Decorative background patterns -->
      <div class="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full blur-2xl -mr-8 -mt-8"></div>
      <div class="absolute bottom-0 left-1/3 w-24 h-24 bg-white/10 rounded-full blur-xl -mb-8"></div>
    </div>
  </div>

  <div class="col-span-12 space-y-6 xl:col-span-7">
    <div><app-ecommerce-metrics /></div>

    <div><app-monthly-sales-chart /></div>
  </div>

  <div class="col-span-12 xl:col-span-5">
    <app-monthly-target />
  </div>

  <div class="col-span-12">
    <app-statics-chart />
  </div>

  <div class="col-span-12 xl:col-span-5">
    <app-demographic-card />
  </div>

  <div class="col-span-12 xl:col-span-7">
    <app-recent-orders/>
  </div>
</div>
