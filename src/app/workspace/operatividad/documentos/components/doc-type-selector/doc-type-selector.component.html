<div class="mb-5 flex justify-start items-center gap-3">
  <div class="bg-gray-100 p-1 rounded-2xl flex gap-1 border border-gray-200/60 dark:bg-white/5 dark:border-gray-800">
    
    <action-button 
      (clicked)="tipoChange.emit('directo')"
      [variant]="selectedTipo === 'directo' ? 'primary' : 'ghost'"
      class="flex items-center gap-2 whitespace-nowrap">
      <icon icon="UsuarioUnico" class="w-3.5 h-3.5"></icon>
      <span>Directo</span>
      <span 
        [class]="selectedTipo === 'directo' ? 'bg-white/20 text-white dark:bg-white/10' : 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400'"
        class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold transition-all duration-300">
        {{ countDirecto }}
      </span>
    </action-button>

    <action-button 
      (clicked)="tipoChange.emit('gestionado')"
      [variant]="selectedTipo === 'gestionado' ? 'primary' : 'ghost'"
      class="flex items-center gap-2 whitespace-nowrap">
      <icon icon="UsuariosGrupo" class="w-3.5 h-3.5"></icon>
      <span>Gestionado</span>
      <span 
        [class]="selectedTipo === 'gestionado' ? 'bg-white/20 text-white dark:bg-white/10' : 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400'"
        class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold transition-all duration-300">
        {{ countGestionado }}
      </span>
    </action-button>

    <action-button 
      (clicked)="tipoChange.emit('recibido_externo')"
      [variant]="selectedTipo === 'recibido_externo' ? 'primary' : 'ghost'"
      class="flex items-center gap-2 whitespace-nowrap">
      <icon icon="DocumentImport" class="w-3.5 h-3.5"></icon>
      <span>Externa</span>
      <span 
        [class]="selectedTipo === 'recibido_externo' ? 'bg-white/20 text-white dark:bg-white/10' : 'bg-gray-200 text-gray-500 dark:bg-gray-700 dark:text-gray-400'"
        class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-extrabold transition-all duration-300">
        {{ countExterno }}
      </span>
    </action-button>

  </div>

  <action-button 
    variant="outline"
    (clicked)="refresh.emit()"
    [disabled]="isLoading"
    class="flex items-center justify-center shrink-0"
    title="Recargar Bandeja">
    @if (isLoading) {
      <icon icon="Spinner" class="w-4 h-4"></icon>
    } @else {
      <icon icon="Refresh" class="w-4 h-4"></icon>
    }
  </action-button>
</div>
