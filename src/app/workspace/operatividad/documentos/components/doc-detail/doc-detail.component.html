@if (!doc) {
  <div class="bg-white border border-gray-200 rounded-2xl flex-1 flex flex-col items-center justify-center p-12 text-center min-h-[400px] shadow-sm dark:border-gray-800 dark:bg-white/3">
    <app-title 
      type="secondary"
      align="center"
      icon="DocumentoEdicion"
      iconSize="xl"
      title="Visualizar Detalle"
      subtitle="Selecciona cualquier documento de la lista de la izquierda para gestionarlo, ver su trazabilidad o previsualizar el PDF."
      customColorClass="text-gray-700 dark:text-gray-300"
      extraSubtitleClasses="max-w-sm mt-2"
    ></app-title>
  </div>
} @else if (pdfViewerUrl() || isLoadingPdf()) {
  @if (selectedViewerOption()?.type === 'emergency') {
    <app-html-viewer
      [title]="doc.num_doc || 'DRAFT / SIN FOLIO'"
      [subtitle]="'HTML de Emergencia'"
      [htmlUrl]="pdfViewerUrl()"
      [isLoading]="isLoadingPdf()"
      [isAuthorized]="doc.estatus_emisor === 'autorizado' || doc.estatus_emisor === 'para_despachar'"
      (closeClick)="closePdfViewer()">
    </app-html-viewer>
  } @else {
    <!-- Visor de PDF GenÃ©rico y Reutilizable -->
    <app-pdf-viewer
      [title]="doc.num_doc || 'DRAFT / SIN FOLIO'"
      [subtitle]="doc.estatus_emisor === 'despachado' || doc.estatus_emisor === 'entregado' ? 'PDF Oficial' : 'PDF Borrador'"
      [pdfUrl]="pdfViewerUrl()"
      [isLoading]="isLoadingPdf()"
      [options]="viewerOptions()"
      [selectedOption]="selectedViewerOption()"
      [showRegenerateButton]="(selectedViewerOption()?.type === 'document' || selectedViewerOption()?.type === 'merged') && !doc?.is_final_render"
      [isRegenerating]="isRegeneratingPdf()"
      (regenerateClick)="onRegeneratePdf()"
      (selectedOptionChange)="onOptionSelected($event)"
      (newTabClick)="openPdfInNewTab()"
      (closeClick)="closePdfViewer()">
    </app-pdf-viewer>
  }
} @else {
  <detail-document-card
    [doc]="doc"
    (openViewer)="onOpenViewer($event)"
    (actionCompleted)="actionCompleted.emit()">
  </detail-document-card>
}
