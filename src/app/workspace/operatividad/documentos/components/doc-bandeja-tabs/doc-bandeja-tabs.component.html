<div class="mb-6 overflow-x-auto pb-2 flex gap-3 scrollbar-hide">
  @if (bandejas.length === 0 && !isLoading) {
    <app-title 
      type="four" 
      align="center"
      title="Sin bandejas activas"
      subtitle="No hay bandejas activas para esta adscripción."
      icon="ArchivoVacio"
      iconSize="sm"
      customColorClass="text-gray-400"
      extraSubtitleClasses="italic"
      class="w-full py-4 bg-gray-50 dark:bg-gray-800/30 rounded-xl border border-dashed border-gray-200 dark:border-gray-800"
    ></app-title>
  } @else {
    @for (bandeja of bandejas; track $index) {
      <action-button 
        (clicked)="bandejaChange.emit(bandeja.name)"
        [variant]="selectedBandeja === bandeja.name ? 'primary' : 'default'">
        <span>{{ bandeja.name }}</span>
        <span 
          [class]="selectedBandeja === bandeja.name ? 'bg-white/20 text-white dark:bg-white/10' : 'bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300'"
          class="px-2.5 py-0.5 rounded-full text-xs font-extrabold transition-all duration-300">
          {{ bandeja.count }}
        </span>
      </action-button>
    }
  }
</div>
