<div class="bg-gray-50 rounded-2xl p-5 border border-gray-150 space-y-4">
  <h4 class="text-xs font-black text-theme-primary uppercase tracking-wider border-b border-gray-200 pb-2">Con Copia Para (C.C.P.)</h4>
  
  <div class="flex flex-col gap-4 max-w-xl">
    <div class="flex flex-col gap-1.5 relative">
      <label class="text-xs font-bold text-gray-500 uppercase">Seleccionar Área</label>
      <app-area-select
        [selectedId]="ccpAreaId()"
        (onSelect)="onCcpAreaChange($event)">
      </app-area-select>
    </div>

    <div class="flex flex-col gap-1.5 relative">
      <label class="text-xs font-bold text-gray-500 uppercase">Empleado</label>
      <app-employee-select
        [selectedId]="ccpEmployeeId()"
        [employeesList]="ccpEmployeesList()"
        [showReload]="true"
        [isLoading]="isCcpEmployeesLoading()"
        [disabled]="!ccpAreaId()"
        placeholder="Seleccione Empleado..."
        (onSelect)="onCcpEmployeeSelect($event)"
        (onClear)="onCcpEmployeeClear()"
        (onReload)="onCcpAreaChange(ccpAreaId(), true)">
      </app-employee-select>
    </div>

    <div class="flex flex-col gap-1.5 relative">
      <label class="text-xs font-bold text-gray-500 uppercase">Motivo / Para qué</label>
      <select 
        [ngModel]="selectedCcpPhrase()"
        (ngModelChange)="onCcpPhraseChange($event)"
        [ngModelOptions]="{standalone: true}"
        class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm font-semibold outline-none text-gray-700 shadow-sm focus:ring-2 focus:ring-theme-primary/30 focus:border-theme-primary">
        @for (phrase of ccpPhrases; track phrase) {
          <option [value]="phrase">{{ phrase }}</option>
        }
        <option value="Otro">Otro...</option>
      </select>
    </div>

    @if (selectedCcpPhrase() === 'Otro') {
      <div class="flex flex-col gap-1.5 animate-fadeIn">
        <label class="text-xs font-bold text-gray-500 uppercase">Especificar Motivo (Otro)</label>
        <input 
          type="text" 
          [ngModel]="customCcpPhrase()"
          (ngModelChange)="customCcpPhrase.set($event)"
          [ngModelOptions]="{standalone: true}"
          placeholder="Escriba el motivo personalizado..."
          class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-xl text-sm font-semibold outline-none text-gray-700 shadow-sm focus:ring-2 focus:ring-theme-primary/30 focus:border-theme-primary">
      </div>
    }

    <div class="pt-2">
      <action-button (clicked)="addCcp()" variant="secondary">
        + Agregar C.C.P.
      </action-button>
    </div>
  </div>

  <!-- Listado de CCPs Agregados -->
  @if (ccps().length > 0) {
    <div class="flex flex-wrap gap-2 pt-2">
      @for (c of ccps(); track c.id_empleado) {
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-white border border-gray-200 text-gray-700 rounded-xl text-xs font-bold shadow-sm">
          <span class="text-theme-primary">{{ c.area_name }}</span>: {{ c.employee_name }} <span class="text-gray-400 font-medium">({{ c.motivo }})</span>
          <action-button (clicked)="removeCcp(c.id_empleado)" variant="ghost">
            <icon icon="Cross" class="w-3.5 h-3.5"></icon>
          </action-button>
        </span>
      }
    </div>
  }
</div>
