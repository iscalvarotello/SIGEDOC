    <app-master-wrapper 
      title="Directorio de Proveedores" 
      icon="AvatarPremium" 
      [layoutSpan]="{ master: 7, detail: 5 }"
      [searchTerm]="searchTerm()"
      searchPlaceholder="Buscar por nombre, RFC..."
      (onSearch)="filtrar($event)"
      (onRefresh)="refresh()"
      (onSync)="sync()"
      (onNew)="nuevo()">
      
      <div master class="h-full">
        <app-data-table 
          [data]="filteredItems()" 
          [columns]="pageConfig.tableColumns"
          [selectedItem]="selectedItem()"
          [isLoading]="isLoading()"
          (onRowSelect)="select($event)"
          (onEdit)="edit($event)"
          (onDelete)="delete($event)">
        </app-data-table>
      </div>

      <div detail class="h-full flex flex-col">
        <app-detail-viewer 
          [data]="selectedItem()"
          [headerConfig]="pageConfig.detailHeader"
          [fields]="pageConfig.detailFields">
          
          <!-- Extra content in detail viewer for contacts -->
          <div class="mt-6 border-t border-gray-100 dark:border-gray-700 pt-4">
            <div class="flex justify-between items-center mb-3">
              <h4 class="text-sm font-semibold text-gray-900 dark:text-white">Contactos</h4>
              <button 
                (click)="openContactModal()"
                class="px-2.5 py-1 text-xs font-medium text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 rounded-md hover:bg-blue-100 dark:hover:bg-blue-900/50 transition-colors flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
                  <path d="M8 9a3 3 0 100-6 3 3 0 000 6zM8 11a6 6 0 016 6H2a6 6 0 016-6zM16 7a1 1 0 10-2 0v1h-1a1 1 0 100 2h1v1a1 1 0 102 0v-1h1a1 1 0 100-2h-1V7z" />
                </svg>
                Nuevo Contacto
              </button>
            </div>
            
            @if (selectedItem()?.contacts?.length) {
              <div class="flex flex-col gap-4 w-full">
                @for (contact of selectedItem()?.contacts; track contact.email || $index) {
                  <app-contact-card 
                    [contact]="contact" 
                    [allowActions]="true"
                    (edit)="openContactModal($index, contact)"
                    (delete)="deleteContact($index)"
                    class="block w-full">
                  </app-contact-card>
                }
              </div>
            } @else {
              <div class="text-center py-4 text-sm text-gray-500 dark:text-gray-400 italic bg-gray-50 dark:bg-gray-800/50 rounded-lg">
                No hay contactos registrados.
              </div>
            }
          </div>

          <!-- Attachments (Anexos) section via generic component -->
          <div class="mt-8 border-t border-gray-100 dark:border-gray-700 pt-6">
            <app-attachment-list
              [attachments]="selectedItem()?.attachments || []"
              [isLoading]="isLoading()"
              title="Anexos y Documentación"
              widthClass="w-full"
              [allowReorder]="true"
              [allowDelete]="canDelete()"
              [allowAdd]="canUpdate()"
              emptyMessage="No hay anexos asociados a este proveedor"
              (onAdd)="openAttachmentModal()"
              (onDelete)="handleRemove($event)"
              (onReorder)="handleReorder($event)">
            </app-attachment-list>
          </div>
          
        </app-detail-viewer>
      </div>

    </app-master-wrapper>

    <!-- Modal de subida de anexos -->
    <app-supplier-attachment-form
      [isOpen]="isAttachmentModalOpen()"
      [isUploading]="isUploading()"
      [isSaving]="isSaving()"
      (closeForm)="closeAttachmentModal()"
      (saveForm)="onSaveAttachment($event)">
    </app-supplier-attachment-form>

    <!-- Modal de Contactos -->
    <app-supplier-contact-form
      [isOpen]="isContactModalOpen()"
      [isSaving]="isSaving()"
      [editContact]="currentContactPayload()"
      [editIndex]="editingContactIndex()"
      (closeForm)="closeContactModal()"
      (saveForm)="saveContact($event)">
    </app-supplier-contact-form>
