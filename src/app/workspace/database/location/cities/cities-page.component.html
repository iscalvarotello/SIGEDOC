<app-master-wrapper 
  title="Base de Datos de Ciudades" 
  icon="iconCity"
  [layoutSpan]="{ master: 7, detail: 5 }"
  
  [serverError]="serverError()"
  searchPlaceholder="Buscar por ciudad o estado..."
  (onSearch)="filtrar($event)"
  (onRefresh)="refresh()"
  (onSync)="sync()"
  (onNew)="nuevo()">
  
  <!-- Filter State Component -->
  <div customFilters class="flex-1 w-full min-w-[400px]">
    <app-filter-state (onStateSelect)="onStateChanged($event)"></app-filter-state>
  </div>
  
  <div master class="h-full">
    <app-data-table 
      [data]="filteredItems()" 
      [columns]="pageConfig.tableColumns"
      [selectedItem]="selectedItem()"
      [isLoading]="isLoading()"
      (onRowSelect)="select($event)"
      (onEdit)="edit($event)"
      (onDelete)="delete($event)">
    </app-data-table>
  </div>

  <div detail class="h-full flex flex-col">
    <app-detail-viewer 
      [data]="selectedItem()"
      [headerConfig]="pageConfig.detailHeader"
      [fields]="pageConfig.detailFields">
    </app-detail-viewer>
  </div>

</app-master-wrapper>
