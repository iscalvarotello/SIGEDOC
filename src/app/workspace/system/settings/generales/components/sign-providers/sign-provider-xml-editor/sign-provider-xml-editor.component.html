<!-- Cabecera del Editor XML -->
<div class="p-4 border-b border-gray-100 dark:border-zinc-800 flex justify-between items-center bg-gray-50/50 dark:bg-zinc-800/50">
  <div class="flex flex-col min-w-0">
    <h3 class="text-lg font-bold text-gray-800 dark:text-zinc-100 truncate block">
      Estructura XML de Envío
    </h3>
    <p class="text-xs text-gray-500 dark:text-zinc-400 truncate block">
      Configuración del Payload XML para el proveedor {{ provider().name }}
    </p>
  </div>
</div>

<!-- Cuerpo del Editor -->
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col flex-1 min-w-0 p-5">
  <div class="flex-1 flex flex-col min-h-[400px]">
    <app-template-editor 
      formControlName="xml_template" 
      [variables]="availableKeys()"
      placeholder="Pegue aquí el XML de su proveedor y utilice las variables para inyectar datos reales."
      [rows]="15"
      class="h-full w-full">
    </app-template-editor>
  </div>

  <!-- Acciones -->
  <div class="mt-6 flex justify-end items-center gap-3">
    <action-button 
      type="submit" 
      variant="primary" 
      label="Guardar Plantilla XML"
      [disabled]="form.invalid || isSaving()"
      [loading]="isSaving()">
    </action-button>
  </div>
</form>
