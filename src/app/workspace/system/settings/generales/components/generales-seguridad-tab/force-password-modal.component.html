<app-modal [isOpen]="isOpen" (close)="onClose()" className="max-w-[480px] w-full m-4">
  <div class="relative w-full p-6 bg-white rounded-3xl dark:bg-gray-900 lg:p-8 flex flex-col gap-4 border border-red-500/10">
    <app-title type="secondary" icon="WarningTriangle" customColorClass="text-red-650 dark:text-red-500" title="¿Confirmar Restablecimiento Masivo?"></app-title>
    
    <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
      Estás a punto de forzar a <strong>todos los usuarios</strong> del sistema a cambiar su contraseña de acceso. Esta acción ejecutará las siguientes directrices de forma inmediata:
    </p>

    <app-list [items]="listItems" type="unordered" bulletKey="dot" bulletColorClass="text-red-500 font-bold" [boxed]="true" boxClass="bg-red-50 dark:bg-red-500/5 p-4 rounded-xl border border-red-500/10">
      <ng-template let-item><span [innerHTML]="item"></span></ng-template>
    </app-list>

    <div class="flex flex-col gap-1.5 mt-2">
      <control type="text" [ngModel]="confirmWord()" (ngModelChange)="confirmWord.set($event)" placeholder="Escriba la palabra aquí" label='Escriba "FORZAR" para confirmar'></control>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center gap-3 justify-end mt-4">
      <action-button type="button" (clicked)="onClose()" variant="default" label="Cancelar"></action-button>
      <action-button type="button" (clicked)="onSubmit()" [disabled]="confirmWord().toLowerCase() !== 'forzar' || isForcingPassword" [loading]="isForcingPassword" variant="danger" label="Ejecutar Restablecimiento"></action-button>
    </div>
  </div>
</app-modal>
