<div class="border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden bg-white dark:bg-gray-850">
  <!-- Toolbar -->
  <div class="flex items-center gap-1 p-2 border-b border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 overflow-x-auto">
    <button type="button" (click)="editor.chain().focus().toggleBold().run()" 
            [class.bg-gray-200]="editor.isActive('bold')"
            [class.dark:bg-gray-700]="editor.isActive('bold')"
            class="p-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Negrita">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M15.6 11.8c1-.7 1.6-1.8 1.6-3 0-2.3-1.9-4.3-4.3-4.3H7v15h6.6c2.5 0 4.6-2 4.6-4.5 0-1.6-.9-3-2.2-3.8zM10 7h2.6c1 0 1.8.8 1.8 1.8S13.6 10.5 12.6 10.5H10V7zm3.1 9.5H10v-3.5h3.1c1.1 0 1.9.8 1.9 1.8s-.8 1.7-1.9 1.7z"/></svg>
    </button>
    
    <button type="button" (click)="editor.chain().focus().toggleItalic().run()" 
            [class.bg-gray-200]="editor.isActive('italic')"
            [class.dark:bg-gray-700]="editor.isActive('italic')"
            class="p-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Cursiva">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 4v3h2.2l-3.4 10H6v3h8v-3h-2.2l3.4-10H18V4h-8z"/></svg>
    </button>
    
    <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
    
    <button type="button" (click)="editor.chain().focus().toggleBulletList().run()" 
            [class.bg-gray-200]="editor.isActive('bulletList')"
            [class.dark:bg-gray-700]="editor.isActive('bulletList')"
            class="p-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Viñetas">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M4 6h2v2H4zm0 5h2v2H4zm0 5h2v2H4zm4-10h12v2H8zm0 5h12v2H8zm0 5h12v2H8z"/></svg>
    </button>

    <button type="button" (click)="editor.chain().focus().toggleOrderedList().run()" 
            [class.bg-gray-200]="editor.isActive('orderedList')"
            [class.dark:bg-gray-700]="editor.isActive('orderedList')"
            class="p-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Lista Numerada">
      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
    </button>

    <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
    
    <button type="button" (click)="editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run()" 
            class="p-1.5 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Insertar Tabla">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
    </button>
    <button type="button" (click)="editor.chain().focus().deleteTable().run()" 
            [disabled]="!editor.can().deleteTable()"
            [class.opacity-50]="!editor.can().deleteTable()"
            class="p-1.5 rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 transition-colors" title="Eliminar Tabla">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </button>
  </div>
  
  <!-- Editor Content -->
  <div class="p-4 flex-1 h-full cursor-text max-w-none text-sm focus:outline-none" (click)="editor.commands.focus()">
    <tiptap-editor [editor]="editor"></tiptap-editor>
  </div>
</div>
