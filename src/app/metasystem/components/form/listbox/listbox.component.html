<div class="flex flex-col gap-1.5 w-full min-w-0" [class.z-50]="isOpen()">
  
  @if (label()) {
    <label class="text-[10px] font-bold text-gray-500 uppercase">{{ label() }}</label>
  }

  <div class="relative w-full flex items-center gap-1.5 min-w-0">
  <!-- Contenedor Principal (Trigger y Dropdown) -->
  <div class="flex-1 relative min-w-0">
    
    <!-- Overlay transparente para cerrar al hacer clic afuera -->
    @if (isOpen() && !isDisabled()) {
      <div class="fixed inset-0 z-40" (click)="closeDropdown()"></div>
    }

    <!-- Trigger (Botón Premium) -->
    <button 
      type="button" 
      [disabled]="isDisabled()"
      (click)="toggleDropdown()"
      [class.z-50]="isOpen()"
      class="relative w-full flex items-center justify-between px-4 py-2 bg-gray-50 dark:bg-gray-900 hover:bg-gray-100/70 dark:hover:bg-gray-800 focus:bg-white dark:focus:bg-black border border-gray-200 dark:border-gray-700 focus:border-theme-secondary focus:ring-1 focus:ring-theme-secondary rounded-xl text-sm transition-all outline-none text-gray-700 dark:text-gray-200 font-bold shadow-sm disabled:opacity-50 disabled:cursor-not-allowed min-w-0">
      
      <div class="flex items-center gap-3 overflow-hidden flex-1 min-w-0">
        <!-- Icono siempre presente si existe -->
        @if (selectedOption()?.iconKey && icons[selectedOption()!.iconKey!]) {
          <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-white border border-gray-200 text-theme-primary dark:bg-gray-800 dark:border-gray-700 dark:text-theme-secondary shadow-sm shrink-0" [innerHTML]="icons[selectedOption()!.iconKey!] | safeHtml"></div>
        }
        
        <div class="flex-1 text-left min-w-0 overflow-hidden">
          <!-- Renderizar plantilla personalizada si existe -->
          @if (triggerTemplate && selectedOption()) {
            <ng-container *ngTemplateOutlet="triggerTemplate; context: { $implicit: selectedOption() }"></ng-container>
          } @else {
            <!-- Fallback estándar -->
            <span class="tracking-wide block truncate">{{ selectedLabel() || placeholder() }}</span>
          }
        </div>
      </div>

      <div class="flex items-center gap-1.5 ml-2 shrink-0">
        <!-- Botón limpiar interno (solo si hay valor seleccionado, no estamos cargando y no estamos deshabilitados) -->
        @if (selectedValue() && !isDisabled()) {
          <div 
            (click)="clearSelection($event)"
            class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1 rounded transition-colors cursor-pointer bg-white/50 hover:bg-gray-200/50 dark:bg-gray-800/50 dark:hover:bg-gray-700/50">
            <icon icon="XClose" class="w-3.5 h-3.5"></icon>
          </div>
        }
        
        <!-- Chevron -->
        <div class="flex items-center justify-center bg-white border border-gray-200 dark:bg-gray-800 dark:border-gray-700 w-8 h-8 rounded-lg shadow-sm">
          <icon icon="ChevronDown" class="w-4 h-4 text-gray-500 transition-transform duration-300" [class.rotate-180]="isOpen()"></icon>
        </div>
      </div>
    </button>

    <!-- Panel Flotante -->
    @if (isOpen() && !isDisabled()) {
      <div class="absolute z-50 w-full mt-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl overflow-hidden animate-fadeIn py-1.5 ring-1 ring-black/5 flex flex-col">
        
        <!-- Buscador Integrado (Opcional) -->
        @if (searchable()) {
          <div class="px-3 pb-2 pt-1 border-b border-gray-100 dark:border-gray-700/50 sticky top-0 bg-white dark:bg-gray-800 z-10 shrink-0">
            <div class="relative flex items-center">
              <span class="absolute left-3 text-gray-400">
                <icon icon="SearchSolid" class="w-4 h-4"></icon>
              </span>
              <input 
                type="text" 
                [placeholder]="searchPlaceholder()"
                [value]="searchQuery()"
                (input)="onSearchInput($event)"
                (click)="$event.stopPropagation()"
                class="w-full pl-9 pr-3 py-2 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-theme-secondary focus:border-theme-secondary transition-all">
            </div>
          </div>
        }

        <!-- Lista de Resultados -->
        <div class="overflow-y-auto max-h-48 flex-1">
          @if (filteredOptions().length === 0) {
            <div class="p-4 text-center text-xs text-gray-400">
              No se encontraron opciones.
            </div>
          } @else {
            @for (opt of filteredOptions(); track opt.value) {
              <button 
                type="button"
                (click)="selectOption(opt, $event)"
                [class.bg-gray-50]="selectedValue() === opt.value"
                [class.dark:bg-gray-700]="selectedValue() === opt.value"
                class="w-full flex items-center justify-between px-3 py-2.5 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors text-left text-sm font-semibold text-gray-700 dark:text-gray-200 border-l-4"
                [class.border-theme-primary]="selectedValue() === opt.value"
                [class.border-transparent]="selectedValue() !== opt.value">
                
                <div class="flex items-center gap-3 w-full">
                  <!-- Diseño del icono siempre se dibuja si existe -->
                  @if (opt.iconKey && icons[opt.iconKey]) {
                    <div class="flex items-center justify-center w-8 h-8 rounded-lg border shadow-sm transition-all shrink-0"
                        [class.bg-white]="selectedValue() === opt.value"
                        [class.border-theme-primary/30]="selectedValue() === opt.value"
                        [class.text-theme-primary]="selectedValue() === opt.value"
                        [class.bg-gray-100]="selectedValue() !== opt.value"
                        [class.border-transparent]="selectedValue() !== opt.value"
                        [class.text-gray-500]="selectedValue() !== opt.value"
                        [innerHTML]="icons[opt.iconKey] | safeHtml">
                    </div>
                  }
                  
                  <div class="flex-1">
                    <!-- Dibuja la plantilla personalizada o el texto por defecto -->
                    @if (optionTemplate) {
                      <ng-container *ngTemplateOutlet="optionTemplate; context: { $implicit: opt }"></ng-container>
                    } @else {
                      <span class="tracking-wide">{{ opt.label }}</span>
                    }
                  </div>
                </div>
  
                <!-- Checkmark para la opción seleccionada -->
                @if (selectedValue() === opt.value) {
                  <div class="flex items-center justify-center w-6 h-6 rounded-full bg-theme-primary/10 text-theme-primary dark:bg-theme-secondary/20 dark:text-theme-secondary shrink-0 ml-2">
                    <icon icon="Check" class="w-3.5 h-3.5"></icon>
                  </div>
                }
              </button>
            }
          }
        </div>
      </div>
    }
  </div>

  <!-- Botón de recarga opcional -->
  @if (showReload()) {
    <button 
      type="button" 
      (click)="handleReload($event)"
      [disabled]="isLoading() || isDisabled()"
      class="p-2.5 bg-gray-50 border border-gray-200 hover:bg-gray-100 dark:bg-gray-900 dark:border-gray-800 dark:hover:bg-gray-800 rounded-xl transition-all text-gray-500 hover:text-theme-primary dark:hover:text-theme-secondary active:scale-95 flex items-center justify-center shrink-0 disabled:opacity-50"
      title="Recargar opciones">
      @if (isLoading()) {
        <span class="flex items-center justify-center" [innerHTML]="icons['animated_reload'] | safeHtml"></span>
      } @else {
        <span class="w-4 h-4 flex items-center justify-center" [innerHTML]="icons['Refresh'] | safeHtml"></span>
      }
    </button>
  }
  </div>
</div>
