<div class="flex flex-col gap-1.5 w-full min-w-0">
  @if (title) {
    <span class="text-[10px] font-bold text-gray-500 uppercase">{{ title }}</span>
  }
  
  @if (leftLabel || rightLabel) {
    <div class="flex justify-between items-center text-xs w-full min-w-0">
      @if (leftLabel) {
        <span class="font-semibold text-gray-500 truncate">{{ leftLabel }}</span>
      } @else {
        <span></span>
      }
      
      @if (rightLabel) {
        <span class="font-bold text-theme-primary truncate">{{ rightLabel }}</span>
      }
    </div>
  }
  
  <input 
    type="range" 
    [min]="min" 
    [max]="max" 
    [step]="step"
    [value]="value()" 
    [disabled]="disabled"
    (input)="onInput($event)"
    (change)="onChangeEvent($event)"
    class="w-full accent-theme-primary bg-gray-200 dark:bg-gray-800 h-1.5 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed"
  />
</div>
