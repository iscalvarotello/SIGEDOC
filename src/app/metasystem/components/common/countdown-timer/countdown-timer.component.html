<div class="flex items-center gap-3 w-full bg-white border border-red-100 rounded-lg p-3 shadow-sm">
  <!-- Timer Icon -->
  <div class="text-red-500 shrink-0">
    <icon icon="ClockOutline" class="w-6 h-6 animate-pulse"></icon>
  </div>
  
  <div class="flex-1 min-w-0 flex flex-col gap-1.5">
    <div class="flex justify-between items-center text-xs font-bold">
      <span class="text-red-600 truncate">Tiempo restante para firmar</span>
      <span class="text-red-700 font-mono bg-red-50 px-2 py-0.5 rounded">{{ timeString() }}</span>
    </div>
    
    <!-- Progress Bar -->
    <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
      <div 
        class="bg-red-500 h-1.5 rounded-full transition-all duration-1000 ease-linear" 
        [style.width.%]="progressPercentage()">
      </div>
    </div>
  </div>
</div>
