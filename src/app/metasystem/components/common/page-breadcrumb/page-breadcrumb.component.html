<div class="flex flex-wrap items-center justify-between gap-3 mb-6">
  <div class="flex items-center gap-3">
    <h2 class="text-xl font-bold text-gray-800 dark:text-white/90">
      {{ pageTitle }}
    </h2>
    @if (badgeValue) {
      <span class="inline-flex items-center rounded-xl border border-gray-200 dark:border-gray-800 shadow-sm overflow-hidden text-sm font-semibold">
        @if (badgeLabel) {
          <span class="bg-gray-50 dark:bg-gray-800/50 px-3 py-1.5 text-gray-500 dark:text-gray-400 border-r border-gray-200 dark:border-gray-800 uppercase text-[10px] tracking-wider font-extrabold">
            {{ badgeLabel }}
          </span>
        }
        <span class="bg-white dark:bg-gray-900 px-3 py-1.5 text-gray-700 dark:text-gray-300">
          {{ badgeValue }}
        </span>
      </span>
    }
  </div>
  <nav>
    <ol class="flex items-center gap-1.5">
      <li>
        <a
          class="inline-flex items-center gap-1.5 text-sm text-gray-500 dark:text-gray-400"
          routerLink="/"
        >
          Inicio
          <icon icon="ChevronRight" class="w-[17px] h-4 stroke-current"></icon>
        </a>
      </li>
      <li class="text-sm text-gray-800 dark:text-white/90">
        {{ pageTitle }}
      </li>
    </ol>
  </nav>
</div>
