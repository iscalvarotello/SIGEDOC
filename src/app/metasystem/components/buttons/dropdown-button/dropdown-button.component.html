<button 
  type="button" 
  (click)="clicked.emit()"
  class="w-full flex items-center justify-between gap-3 px-4 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/30 rounded-xl text-white text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-theme-secondary/40 active:scale-[0.98]">
  <div class="flex items-center gap-2.5 min-w-0">
    @if (icon()) {
      <span class="text-sm shrink-0">
        @if (isEmoji()) {
          {{ icon() }}
        } @else {
          <icon [icon]="icon()!" class="w-4 h-4"></icon>
        }
      </span>
    }
    <div class="min-w-0 text-left">
      <span class="block text-xs font-black truncate">
        {{ label() }}
      </span>
      @if (sublabel()) {
        <span class="block text-[9px] text-theme-secondary font-semibold truncate mt-0.5">
          {{ sublabel() }}
        </span>
      }
    </div>
  </div>
  
  <!-- Dropdown Chevron Icon -->
  <icon icon="ChevronDown" class="w-4 h-4 shrink-0 transition-transform duration-300 text-white/70" [class.rotate-180]="isOpen()"></icon>
</button>
