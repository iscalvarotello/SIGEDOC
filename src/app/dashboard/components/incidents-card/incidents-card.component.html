<app-dashboard-card>
  
  <!-- HEADER -->
  <div card-header class="flex items-center gap-2.5">
    <span class="text-sm font-black text-gray-800 dark:text-white flex items-center gap-2">
      🛡️ Incidencias y Permisos
    </span>
  </div>

  <!-- BODY -->
  <div card-body class="space-y-4">
    <!-- Progress Bars Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Vacaciones -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold text-gray-700 dark:text-gray-300">Vacaciones Disponibles</span>
          <span class="font-extrabold text-[#691C32] dark:text-[#BC955C]">10 / 14 días</span>
        </div>
        <div class="w-full bg-gray-150 dark:bg-gray-800 rounded-full h-2">
          <div class="bg-gradient-to-r from-[#691C32] to-[#BC955C] h-2 rounded-full" style="width: 71%"></div>
        </div>
      </div>

      <!-- Permisos Económicos -->
      <div class="space-y-1.5">
        <div class="flex justify-between items-center text-xs">
          <span class="font-bold text-gray-700 dark:text-gray-300">Permisos Económicos</span>
          <span class="font-extrabold text-indigo-600 dark:text-indigo-400">3 / 5 usados</span>
        </div>
        <div class="w-full bg-gray-150 dark:bg-gray-800 rounded-full h-2">
          <div class="bg-indigo-500 h-2 rounded-full" style="width: 60%"></div>
        </div>
      </div>
    </div>

    <!-- Recent Incident Requests Table -->
    <div class="overflow-x-auto pt-1">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
          <tr class="border-b border-gray-100 dark:border-gray-800 text-[9px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-wider">
            <th class="pb-1.5 font-extrabold w-28 md:w-32">Concepto</th>
            <th class="pb-1.5 text-center font-extrabold">Fecha</th>
            <th class="pb-1.5 text-right font-extrabold">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50 dark:divide-gray-850">
          <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-800/10 transition-colors">
            <td class="py-2 font-bold text-gray-800 dark:text-gray-200">
              Justificante Médico
            </td>
            <td class="py-2 text-center text-gray-500 dark:text-gray-400">
              18 Jun 2026
            </td>
            <td class="py-2 text-right">
              <span class="inline-flex items-center justify-center px-2 py-0.5 text-[9px] font-black bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-400 rounded-full border border-emerald-250/20">
                Aprobado
              </span>
            </td>
          </tr>
          <tr class="hover:bg-gray-50/50 dark:hover:bg-gray-800/10 transition-colors">
            <td class="py-2 font-bold text-gray-800 dark:text-gray-200">
              Pase de Salida (Personal)
            </td>
            <td class="py-2 text-center text-gray-500 dark:text-gray-400">
              24 Jun 2026
            </td>
            <td class="py-2 text-right">
              <span class="inline-flex items-center justify-center px-2 py-0.5 text-[9px] font-black bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-450 rounded-full border border-amber-250/20">
                Pendiente
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- FOOTER -->
  <div card-footer class="flex items-center justify-between w-full">
    <span class="flex items-center gap-1 text-gray-400 dark:text-gray-500 font-medium">
      <span class="inline-flex rounded-full h-1 w-1 bg-emerald-400 shrink-0 animate-pulse"></span>
      Actualizado
    </span>
    <a href="/incidencias/mis-solicitudes" class="text-[#691C32] dark:text-[#BC955C] hover:underline font-bold inline-flex items-center gap-0.5 transition-all active:translate-x-0.5">
      Ver mis solicitudes
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-3 h-3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </a>
  </div>
  
</app-dashboard-card>
