<div class="bg-white dark:bg-gray-900 border border-gray-150 dark:border-gray-800/60 rounded-2xl shadow-sm overflow-hidden flex flex-col transition-all duration-300 hover:shadow-md hover:border-gray-200 dark:hover:border-gray-700">
  <!-- Card Header -->
  <div class="px-5 py-4 border-b border-gray-100 dark:border-gray-800/80 flex items-center justify-between">
    <ng-content select="[card-header]"></ng-content>
  </div>
  
  <!-- Card Body -->
  <div class="p-5 flex-1 text-sm text-gray-600 dark:text-gray-300">
    <ng-content select="[card-body]"></ng-content>
  </div>
  
  <!-- Card Footer -->
  <div class="px-5 py-3.5 bg-gray-50/50 dark:bg-gray-800/20 border-t border-gray-100 dark:border-gray-800 flex items-center justify-between text-xs text-gray-400">
    <ng-content select="[card-footer]"></ng-content>
  </div>
</div>
