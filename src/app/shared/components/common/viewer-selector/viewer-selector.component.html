<div class="relative inline-block w-full max-w-xs md:max-w-md text-left">
  <!-- Trigger Button -->
  <button 
    type="button" 
    (click)="toggleDropdown()"
    class="w-full flex items-center justify-between gap-3 px-4 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/30 rounded-xl text-white text-xs font-bold transition-all focus:outline-none focus:ring-2 focus:ring-[#BC955C]/40 active:scale-[0.98]">
    <div class="flex items-center gap-2.5 min-w-0">
      <span class="text-sm shrink-0">
        {{ selectedOption()?.type === 'document' ? '📄' : (selectedOption()?.type === 'merged' ? '📑' : '📎') }}
      </span>
      <div class="min-w-0 text-left">
        <span class="block text-xs font-black truncate">
          {{ selectedOption()?.label || 'Seleccionar Archivo...' }}
        </span>
        @if (selectedOption()?.sublabel) {
          <span class="block text-[9px] text-[#BC955C] font-semibold truncate mt-0.5">
            {{ selectedOption()?.sublabel }}
          </span>
        }
      </div>
    </div>
    
    <!-- Dropdown Chevron Icon -->
    <svg 
      class="w-4 h-4 shrink-0 transition-transform duration-300 text-white/70"
      [class.rotate-180]="isOpen()"
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Options List Dropdown -->
  @if (isOpen()) {
    <div 
      class="absolute left-0 right-0 mt-2 bg-white rounded-xl shadow-xl border border-gray-200 py-1.5 z-50 max-h-60 overflow-y-auto overflow-x-hidden animate-fadeIn"
      style="transform-origin: top;">
      
      @for (opt of options(); track opt.type + '-' + opt.id) {
        <button 
          type="button" 
          (click)="selectOption(opt)"
          [class.bg-[#691C32]/5]="selectedOption()?.id === opt.id && selectedOption()?.type === opt.type"
          [class.text-[#691C32]]="selectedOption()?.id === opt.id && selectedOption()?.type === opt.type"
          class="w-full flex items-start gap-3 px-4 py-2.5 hover:bg-gray-50 text-gray-700 transition-colors text-left focus:outline-none">
          <span class="text-sm shrink-0 mt-0.5">
            {{ opt.type === 'document' ? '📄' : (opt.type === 'merged' ? '📑' : '📎') }}
          </span>
          <div class="min-w-0 flex-1">
            <span class="block text-xs font-black truncate">
              {{ opt.label }}
            </span>
            @if (opt.sublabel) {
              <span class="block text-[9px] text-gray-400 font-bold truncate mt-0.5">
                {{ opt.sublabel }}
              </span>
            }
          </div>
        </button>
      } @empty {
        <div class="px-4 py-3 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider">
          Sin opciones disponibles
        </div>
      }
    </div>
  }
</div>
