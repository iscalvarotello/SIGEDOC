  <!-- Top spacing -->
  <div class="w-full max-w-md pt-8 mx-auto"></div>

  <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
    <div class="space-y-6">
      <!-- Header Section -->
      <div class="text-center sm:text-left space-y-4">
        <!-- Logo / Escudo -->
        <div class="flex justify-center sm:justify-start">
          <img
            src="/images/logo/oficial.png"
            alt="Escudo de Chiapas"
            class="h-16 w-auto object-contain dark:brightness-110"
          />
        </div>
        
        <div class="space-y-1">
          <!-- Secretaría -->
          <h2 class="text-xs font-bold tracking-widest text-gray-500 dark:text-gray-400 uppercase">
            Secretaría de Economía y del Trabajo
          </h2>
          <!-- SIGEDOC -->
          <h1 class="text-4xl sm:text-5xl font-black text-[#691C32] dark:text-[#BC955C] tracking-tight">
            SIGEDOC
          </h1>
          <!-- Sistema de Gestión Documental -->
          <p class="text-sm font-semibold text-gray-600 dark:text-gray-300">
            Sistema de Gestión Documental
          </p>
        </div>
      </div>

      <!-- Error Message -->
      @if (errorMessage()) {
        <div class="rounded-lg bg-rose-50 dark:bg-rose-950/20 p-4 text-sm text-rose-700 dark:text-rose-400 border border-rose-100 dark:border-rose-900/30 animate-fadeIn">
          {{ errorMessage() }}
        </div>
      }

      <!-- Form -->
      <form (ngSubmit)="onSignIn()" class="space-y-5">
        <div>
          <app-label>Correo Electrónico <span class="text-error-500">*</span></app-label>
          <app-input-field
            type="email"
            placeholder="usuario@correo.com"
            [(value)]="email"
            name="email"
            autocomplete="username email"
            class="form-input"
            required
          />
        </div>

        <div>
          <app-label>Contraseña <span class="text-error-500">*</span></app-label>
          <app-password-input
            placeholder="Ingrese su contraseña"
            [(value)]="password"
            name="password"
            autocomplete="current-password"
            [required]="true"
          />
        </div>

        <div class="flex items-center justify-between">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">
            ¿No tiene una cuenta?
            <a
              routerLink="/signup"
              class="text-[#691C32] hover:text-[#691C32]/80 dark:text-[#BC955C] dark:hover:text-[#BC955C]/80 font-bold"
            >
              Registrarse
            </a>
          </p>
          <a
            routerLink="/reset-password-required"
            [queryParams]="{ security_alert: false }"
            class="text-xs font-semibold text-[#691C32] hover:text-[#691C32]/80 dark:text-[#BC955C] dark:hover:text-[#BC955C]/80"
          >
            ¿Olvidó su contraseña?
          </a>
        </div>

        <app-button
          className="w-full bg-[#691C32] hover:bg-[#691C32]/90 dark:bg-[#BC955C] dark:hover:bg-[#BC955C]/90 text-white font-bold transition-all py-3 rounded-lg"
          size="sm"
          (btnClick)="onSignIn()"
        >
          @if (isLoading()) {
            Iniciando sesión...
          } @else {
            Iniciar Sesión
          }
        </app-button>
      </form>
    </div>
  </div>
