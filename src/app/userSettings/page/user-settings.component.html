<app-page-breadcrumb pageTitle="Configuración Personal" />

<div class="grid grid-cols-12 gap-6 mt-6">
  <!-- Barra Lateral de Navegación (Tabs) -->
  <div class="col-span-12 lg:col-span-3">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-4 shadow-theme-xs space-y-1">
      <button 
        (click)="setTab('employee')"
        [ngClass]="{
          'bg-[#691C32]/5 text-[#691C32] dark:bg-[#691C32]/10 dark:text-white border-[#691C32]': currentTab() === 'employee',
          'text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/3 border-transparent': currentTab() !== 'employee'
        }"
        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold rounded-xl border-l-4 text-left transition-all duration-150 cursor-pointer"
      >
        <span class="text-lg">👤</span>
        Datos del empleado
      </button>

      <button 
        (click)="setTab('area')"
        [ngClass]="{
          'bg-[#691C32]/5 text-[#691C32] dark:bg-[#691C32]/10 dark:text-white border-[#691C32]': currentTab() === 'area',
          'text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/3 border-transparent': currentTab() !== 'area'
        }"
        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold rounded-xl border-l-4 text-left transition-all duration-150 cursor-pointer"
      >
        <span class="text-lg">🏢</span>
        Configuraciones del área
      </button>

      <button 
        (click)="setTab('dashboard')"
        [ngClass]="{
          'bg-[#691C32]/5 text-[#691C32] dark:bg-[#691C32]/10 dark:text-white border-[#691C32]': currentTab() === 'dashboard',
          'text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/3 border-transparent': currentTab() !== 'dashboard'
        }"
        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold rounded-xl border-l-4 text-left transition-all duration-150 cursor-pointer"
      >
        <span class="text-lg">📊</span>
        Configuración del Dashboard
      </button>

      <button 
        (click)="setTab('firma')"
        [ngClass]="{
          'bg-[#691C32]/5 text-[#691C32] dark:bg-[#691C32]/10 dark:text-white border-[#691C32]': currentTab() === 'firma',
          'text-gray-700 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/3 border-transparent': currentTab() !== 'firma'
        }"
        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold rounded-xl border-l-4 text-left transition-all duration-150 cursor-pointer"
      >
        <span class="text-lg">✒️</span>
        Firma y Autorización
      </button>
    </div>
  </div>

  <!-- Contenedor Principal de Contenido -->
  <div class="col-span-12 lg:col-span-9">
    <!-- PESTAÑA: Datos del empleado -->
    @if (currentTab() === 'employee') { <app-user-employee-tab /> }

    <!-- PESTAÑA: Configuraciones del área -->
    @if (currentTab() === 'area') { <app-user-area-tab />}

    <!-- PESTAÑA: Configuración del Dashboard -->
    @if (currentTab() === 'dashboard') {<app-user-dashboard-tab />}

    <!-- PESTAÑA: Firma y Autorización (Vo.Bo.) -->
    @if (currentTab() === 'firma') { <app-user-firma-tab /> }
  </div>
</div>
